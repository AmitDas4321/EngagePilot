name: Deploy EngagePilot

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: engagepilot-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Deploy to Ubuntu Server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -eu

            cd /www/wwwroot/EngagePilot

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Installing dependencies..."
            npm ci

            echo "Generating Prisma client..."
            npm run db:generate

            echo "Applying database migrations..."
            npm run db:migrate

            echo "Building production application..."
            npm run build

            echo "Starting or restarting web application..."
            if pm2 describe EngagePilot >/dev/null 2>&1; then
              pm2 restart EngagePilot --update-env
            else
              pm2 start npm --name EngagePilot -- start
            fi

            echo "Starting or restarting DM worker..."
            if pm2 describe EngagePilot-Worker >/dev/null 2>&1; then
              pm2 restart EngagePilot-Worker --update-env
            else
              pm2 start npm --name EngagePilot-Worker -- run worker
            fi

            pm2 save

            echo "Deployment completed."
            pm2 status
